# Builds the two PolitiGo images and publishes them to GitHub's registry (ghcr.io/<owner>/politigo-web|api).
# Runs on every push to main, on version tags (v1.2.0 -> image tag 1.2.0) and on demand.
name: images
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
# A newer push to the same branch cancels the build it makes obsolete.
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only this job may publish packages; the GITHUB_TOKEN gets nothing else.
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - {name: web, dockerfile: Dockerfile}
          - {name: api, dockerfile: server/Dockerfile}
    steps:
      - uses: actions/checkout@v4
      # Tests first: an image is only published when the rules and the API pass.
      - if: matrix.name == 'api'
        run: docker run --rm -e TZ=Europe/Paris -v "$PWD/web/rules.mjs:/app/rules.mjs:ro" -v "$PWD/server/server.mjs:/app/server.mjs:ro" -v "$PWD/web:/w/web:ro" -v "$PWD/tests:/w/tests:ro" -w /w node:24-alpine node --test tests/rules.test.mjs tests/rules.extra.test.mjs tests/server.test.mjs tests/server.extra.test.mjs
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/politigo-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          pull: true
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
