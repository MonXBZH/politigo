# Builds the three PolitiGo images and publishes them to GitHub's registry (ghcr.io/<owner>/politigo-web|api|admin).
# Runs on every push to main (a merged pull request from dev), on version tags (v1.2.0 -> image tag 1.2.0) and
# on demand. Day-to-day work happens on dev, where ci.yml only runs the tests.
name: images
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
# Every action is pinned to a full commit SHA (the tag in the comment, kept up to date by Dependabot): a moved tag
# cannot swap the code that runs with the registry token.
permissions:
  contents: read
# A newer push to the same branch cancels the build it makes obsolete.
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Last guard before publishing, for every image: the tests pass, and a version tag sits on main.
  tests:
    # Not "tests": that name is the pull request check required by main's ruleset (ci.yml).
    name: tests before publishing
    # A manual run started from another branch must not publish unmerged code.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: a version tag must point at a commit of main
        if: startsWith(github.ref, 'refs/tags/v')
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
      - run: bash tests/run-server.sh
  build:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only this job may publish packages; the GITHUB_TOKEN gets nothing else.
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - {name: web, dockerfile: Dockerfile}
          - {name: api, dockerfile: server/Dockerfile}
          # The optional admin interface.
          - {name: admin, dockerfile: admin/Dockerfile}
    steps:
      # The full history and tags: git describe names the version shown in the game ("v1.2.1", "v1.2.1-3-gabc1234").
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: version
        run: echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/politigo-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          pull: true
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Only the API uses it: the static web image stays independent of the version (and of its cache).
          build-args: ${{ matrix.name == 'api' && format('VERSION={0}', steps.version.outputs.version) || '' }}
