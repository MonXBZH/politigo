# Builds the two PolitiGo images and publishes them to GitHub's registry (ghcr.io/<owner>/politigo-web|api).
# Runs on every push to main (a merged pull request from dev), on version tags (v1.2.0 -> image tag 1.2.0) and
# on demand. Day-to-day work happens on dev, where ci.yml only runs the tests.
name: images
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
# A newer push to the same branch cancels the build it makes obsolete.
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Last guard before publishing, for both images: the tests pass, and a version tag sits on main.
  tests:
    # Not "tests": that name is the pull request check required by main's ruleset (ci.yml).
    name: tests before publishing
    # A manual run started from another branch must not publish unmerged code.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: a version tag must point at a commit of main
        if: startsWith(github.ref, 'refs/tags/v')
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
      - run: bash tests/run-server.sh
  build:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only this job may publish packages; the GITHUB_TOKEN gets nothing else.
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - {name: web, dockerfile: Dockerfile}
          - {name: api, dockerfile: server/Dockerfile}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/politigo-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          pull: true
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
