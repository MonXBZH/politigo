# Runs the whole test suite on dev and on every pull request. Publishes nothing (images: see images.yml, main only).
# The job name "tests" is the status check required by main's ruleset: renaming it blocks every pull request.
name: ci
on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]
# Every action is pinned to a full commit SHA (the tag in the comment, kept up to date by Dependabot): a moved tag
# cannot swap the code that runs with the registry token.
permissions:
  contents: read
# A newer push to the same branch or pull request cancels the run it makes obsolete.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash tests/run-server.sh
