server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Slow or oversized requests are cut short; only the live stream (/events) stays open longer.
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 30s;
    client_max_body_size 8k;

    # Security headers, inherited by every location below (none of them uses add_header).
    # No inline script or style is left in the page, so the policy needs no 'unsafe-inline'.
    # connect-src 'self' covers the API calls and the live stream (/events). manifest-src would fall back to
    # default-src ('none'); worker-src (the duel notifications' service worker) is spelled out rather than inherited.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    gzip on;
    gzip_vary on;
    # Not application/json: compressed API answers mixing secrets and attacker input invite BREACH-style guessing.
    gzip_types text/css application/javascript image/svg+xml;

    location ~ /\. { return 404; }

    # The API's address is looked up again every 10 s through Docker's DNS, instead of once at start: an "api"
    # container recreated by an update (new address) is found without restarting this one. A variable in
    # proxy_pass, without a URI part, forwards the request URI unchanged.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:3000;

    # The game API. X-Forwarded-For keeps the chain built by the site's reverse proxy (the API reads
    # the entry that proxy appended, see PROXY_HOPS), and the Host header stays the public one.
    # ^~ so that the regex locations below (dot-files, .mjs) never catch an API path.
    location ^~ /api/ {
        limit_except GET POST DELETE { deny all; }
        proxy_pass $api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    # The live leaderboard and feed: Server-Sent Events, never buffered, kept open.
    location = /events {
        limit_except GET { deny all; }
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Static files: reading only. Fonts never change; the page, scripts and styles are revalidated on
    # every load (ETag, cheap 304s), so a redeploy is visible at once without cache-busting file names.
    location /fonts/ { limit_except GET { deny all; } expires 30d; }
    # nginx's mime.types does not know .mjs, and browsers refuse a module served as octet-stream.
    location ~ \.mjs$ { limit_except GET { deny all; } default_type application/javascript; expires epoch; try_files $uri =404; }
    # The web app manifest (home-screen install, needed for Web Push on iPhone), with its own type whatever
    # mime.types says (the empty types block makes default_type apply).
    location ~ \.webmanifest$ { limit_except GET { deny all; } types { } default_type application/manifest+json; expires epoch; try_files $uri =404; }
    # sw.js goes through "location /" below: revalidated on every load, so a new service worker is picked up at once.
    location / {
        limit_except GET { deny all; }
        expires epoch;
        try_files $uri $uri/ =404;
    }
}
