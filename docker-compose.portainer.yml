# PolitiGo for Portainer (or any server that pulls images instead of building them).
# Paste this file into a Portainer stack (Web editor) and set the variables in "Environment variables"
# (same names as .env.example). The images come from a registry: see docs/DEPLOIEMENT.md, "Variante Portainer".
services:
  web:
    image: ${POLITIGO_IMAGES:-ghcr.io/monxbzh/politigo}-web:${POLITIGO_TAG:-latest}
    ports:
      # Bind to the server's internal address and allow only the reverse proxy to reach it.
      # Host port: POLITIGO_PORT (8080 by default; only the left side changes, the container keeps 8080).
      - "${POLITIGO_BIND:-127.0.0.1}:${POLITIGO_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    mem_limit: 128m
    pids_limit: 128
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    image: ${POLITIGO_IMAGES:-ghcr.io/monxbzh/politigo}-api:${POLITIGO_TAG:-latest}
    environment:
      # Unset: the server generates a code once and prints it in its logs ("off" closes registrations).
      POLITIGO_INVITE: ${POLITIGO_INVITE:-}
      POLITIGO_SPEED: ${POLITIGO_SPEED:-1}
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      PROXY_HOPS: ${PROXY_HOPS:-2}
      MAX_PLAYERS: ${MAX_PLAYERS:-50}
      # Duel notifications (Web Push): "off" disables them; the contact (mailto: or https: URL) is sent to the push services.
      POLITIGO_PUSH: ${POLITIGO_PUSH:-}
      POLITIGO_PUSH_CONTACT: ${POLITIGO_PUSH_CONTACT:-}
      # Seasonal events: empty = automatic (Halloween on 31 Oct-1 Nov); "off" switches them off, "halloween" forces it (tests).
      POLITIGO_EVENT: ${POLITIGO_EVENT:-}
      # Chat: empty = closed. "on" (both rooms), "global" or "camp" = how a FRESH game starts; afterwards the
      # admin interface's Réglages decide (this variable no longer changes anything once set there).
      POLITIGO_CHAT: ${POLITIGO_CHAT:-}
      # Name of this game, shown in the admin interface (useful when it manages several games). Empty = "PolitiGo".
      POLITIGO_SERVER_NAME: ${POLITIGO_SERVER_NAME:-}
      # Admin socket (node admin.mjs, and the admin container through the shared volume below).
      POLITIGO_ADMIN_SOCKET: /run/politigo/admin.sock
      # Extra game run by a console elsewhere (another stack or another host): paste the three lines given by that
      # console's Parties page. This api then connects out to the console's link port (TLS, certificate fingerprint
      # checked before the token is sent); it opens no port itself. All three or none (one or two = error in the logs,
      # no link, the game still runs). Leave them empty on the stack that runs the console: it uses the socket above.
      POLITIGO_ADMIN_URL: ${POLITIGO_ADMIN_URL:-}
      POLITIGO_ADMIN_TLS: ${POLITIGO_ADMIN_TLS:-}
      POLITIGO_ADMIN_TOKEN: ${POLITIGO_ADMIN_TOKEN:-}
    volumes:
      - politigo-data:/data
      - politigo-admin-sock:/run/politigo
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    mem_limit: 256m
    pids_limit: 128
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ------------------------------------------------------------------ OPTIONAL: admin web interface
  # Started only with the "admin" profile: COMPOSE_PROFILES=admin in .env (Portainer: in the stack's Environment
  # variables, Portainer 2.29 or newer, standalone Docker only, one value without commas). Without it this service is
  # skipped and the game runs alone: it does not need the console, and node admin.mjs keeps working inside the api
  # container. Extra games linked to a console elsewhere leave COMPOSE_PROFILES unset (no second console).
  # Removing COMPOSE_PROFILES later does not stop an admin container already running: stop or remove it by hand.
  # Password: POLITIGO_ADMIN_PASSWORD (12+ characters), or empty = generated at first start and printed ONCE in
  # this container's logs. Publish it only to your LAN, or behind your reverse proxy with HTTPS (see .env.example).
  # Behind Nginx Proxy Manager: POLITIGO_ADMIN_BIND=127.0.0.1 (or firewall port 8090) AND POLITIGO_ADMIN_PROXY_HOPS=1;
  # with the port still open to everyone, a direct client could fake X-Forwarded-For and dodge the per-address limit.
  # Host facing the internet (VPS, public IP): NEVER keep 0.0.0.0 with a generated password; bind 127.0.0.1 and go
  # through the reverse proxy with HTTPS, or firewall 8090 to your own addresses. The container warns at start.
  # Login limits: 5 failures per address and 30 in all per 15 min; under attack the global cap can lock you out for 15 min.
  admin:
    profiles: [admin]
    image: ${POLITIGO_IMAGES:-ghcr.io/monxbzh/politigo}-admin:${POLITIGO_TAG:-latest}
    ports:
      # Host port: POLITIGO_ADMIN_PORT (8090 by default), e.g. 8095 if 8090 is taken; the container keeps 8090.
      - "${POLITIGO_ADMIN_BIND:-0.0.0.0}:${POLITIGO_ADMIN_PORT:-8090}:8090"
      # Link port for extra games (TLS, listening only with POLITIGO_ADMIN_LINK=on; otherwise nothing answers behind it).
      # Host port: POLITIGO_ADMIN_LINK_PORT (8091 by default); the container always listens on 8091. Open it in the
      # firewall to the extra games' hosts only.
      # Its address: POLITIGO_ADMIN_LINK_BIND, or POLITIGO_ADMIN_BIND when unset (a console bound to 127.0.0.1 behind
      # Nginx Proxy Manager keeps the link reachable with LINK_BIND set to the host's internal address).
      - "${POLITIGO_ADMIN_LINK_BIND:-${POLITIGO_ADMIN_BIND:-0.0.0.0}}:${POLITIGO_ADMIN_LINK_PORT:-8091}:8091"
    environment:
      POLITIGO_ADMIN_PASSWORD: ${POLITIGO_ADMIN_PASSWORD:-}
      POLITIGO_ADMIN_SOCKET: /run/politigo/admin.sock
      # Network link: "on" opens the link port (8091) so extra games (other stacks, other hosts) can connect to this
      # console; add them in the Parties page. Empty or anything else = closed, this stack only (by its socket).
      POLITIGO_ADMIN_LINK: ${POLITIGO_ADMIN_LINK:-}
      # Same values as the published ports above: the Parties page shows the address the extra games must paste.
      POLITIGO_ADMIN_LINK_BIND: ${POLITIGO_ADMIN_LINK_BIND:-${POLITIGO_ADMIN_BIND:-0.0.0.0}}   # the link's published address, shown in Parties
      POLITIGO_ADMIN_LINK_PORT: ${POLITIGO_ADMIN_LINK_PORT:-8091}
      # Old mode, same host only (prefer the network link): one admin socket per game, "Name=/socket;Other name=/other/socket".
      POLITIGO_ADMIN_SERVERS: ${POLITIGO_ADMIN_SERVERS:-}
      # 1 behind Nginx Proxy Manager (login limits per real client address), with the port bound to 127.0.0.1 or
      # firewalled; 0 when reached directly (otherwise X-Forwarded-For could be faked).
      ADMIN_PROXY_HOPS: ${POLITIGO_ADMIN_PROXY_HOPS:-0}
      # 1 = the session cookie is HTTPS-only even without X-Forwarded-Proto: https from the proxy.
      ADMIN_COOKIE_SECURE: ${POLITIGO_ADMIN_COOKIE_SECURE:-0}
    volumes:
      - politigo-admin-sock:/run/politigo
      - politigo-admin-data:/data-admin
      # Old mode, same host (prefer the network link, POLITIGO_ADMIN_LINK): mount another stack's socket volume too,
      # then list both in POLITIGO_ADMIN_SERVERS, e.g. "Prod=/run/politigo/admin.sock;Test=/run/politigo-test/admin.sock"
      # (and declare the external volume below).
      # - politigo-test-admin-sock:/run/politigo-test
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    mem_limit: 256m   # 1.7.3: the parties' link (their answers, the backups it checks) needs more than the console alone
    pids_limit: 64
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  politigo-data:
  # Shared by api and admin: the admin socket lives there (also created without the admin profile; harmless).
  politigo-admin-sock:
  # OPTIONAL admin: password hash, moderators, link certificate and parties, automatic backups (/data-admin).
  politigo-admin-data:
  # Old mode, same host: another stack's socket volume, created by that stack (docker volume ls: "<stack>_politigo-admin-sock").
  # politigo-test-admin-sock:
  #   external: true
  #   name: politigo-test_politigo-admin-sock
