# PolitiGo for Portainer (or any server that pulls images instead of building them).
# Paste this file into a Portainer stack (Web editor) and set the variables in "Environment variables"
# (same names as .env.example). The images come from a registry: see docs/DEPLOIEMENT.md, "Variante Portainer".
services:
  web:
    image: ${POLITIGO_IMAGES:-ghcr.io/monxbzh/politigo}-web:${POLITIGO_TAG:-latest}
    ports:
      # Bind to the server's internal address and allow only the reverse proxy to reach it.
      - "${POLITIGO_BIND:-127.0.0.1}:${POLITIGO_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    mem_limit: 128m
    pids_limit: 128
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    image: ${POLITIGO_IMAGES:-ghcr.io/monxbzh/politigo}-api:${POLITIGO_TAG:-latest}
    environment:
      # Unset: the server generates a code once and prints it in its logs ("off" closes registrations).
      POLITIGO_INVITE: ${POLITIGO_INVITE:-}
      POLITIGO_SPEED: ${POLITIGO_SPEED:-1}
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      PROXY_HOPS: ${PROXY_HOPS:-2}
      MAX_PLAYERS: ${MAX_PLAYERS:-50}
    volumes:
      - politigo-data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    mem_limit: 256m
    pids_limit: 128
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  politigo-data:
