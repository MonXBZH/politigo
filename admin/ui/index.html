<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="dark">
<title>PolitiGo · Administration</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/admin.css">
<script type="module" src="/admin.js"></script>
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<main id="login" class="login" hidden>
 <form id="login-form" class="card login-card" novalidate>
  <div class="brand"><span class="logo" aria-hidden="true"></span><div>PolitiGo<small>Administration</small></div></div>
  <label for="login-pw">Mot de passe d'administration</label>
  <input id="login-pw" type="password" autocomplete="current-password" required maxlength="200">
  <button class="btn go" type="submit">Se connecter</button>
  <p id="login-err" class="err" role="alert"></p>
  <p class="muted small">Mot de passe : variable <code>POLITIGO_ADMIN_PASSWORD</code>, ou celui généré au premier démarrage (logs du conteneur <code>admin</code>).</p>
 </form>
</main>

<div id="app" class="shell" hidden>
 <header class="top">
  <div class="brand"><span class="logo" aria-hidden="true"></span><div>PolitiGo<small>Administration</small></div></div>
  <div class="top-right"><div id="srv" class="srv"></div><button id="logout" class="btn small" type="button">Déconnexion</button></div>
 </header>
 <nav id="nav" class="nav" aria-label="Sections"></nav>
 <section id="view" class="view" tabindex="-1"></section>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<dialog id="dlg" class="dlg">
 <div class="dlg-card">
  <h2 id="dlg-title"></h2>
  <div id="dlg-body"></div>
  <div class="btn-row end">
   <button id="dlg-cancel" class="btn" type="button">Annuler</button>
   <button id="dlg-ok" class="btn go" type="button">OK</button>
  </div>
 </div>
</dialog>
</body>
</html>
